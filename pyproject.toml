[build-system]
requires = ["setuptools>=42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rustdesk-mcp"
version = "0.1.0"
description = "FastMCP 3.1.0 server for RustDesk remote desktop management"
authors = [
    { name = "Sandra", email = "sandraschipal@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.34",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "structlog>=23.0.0",
    "python-multipart>=0.0.6",
    "aiohttp>=3.8.0",
    "pywinctl>=0.3.0",
    "pywinauto>=0.6.8",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.16.0,<0.17",
    "pytest-cov>=4.0.0",
    "prefab-ui>=0.14.0",
    "tomli-w>=1.0.0",
    "wakeonlan>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.16.0,<0.17",
]

[project.scripts]
rustdesk-mcp = "rustdesk_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | _build
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v --cov=rustdesk_mcp --cov-report=term-missing"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF", "T20"]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002", "S101", "B008", "S106", "S101", "B008", "S106", "RUF012", "S603", "S607", "S324", "E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/rustdesk_mcp/__main__.py" = ["T20"]
"tests/**/*" = ["T20", "S101"]
"scripts/**/*" = ["T20"]
"quick_test.py" = ["T20"]
"simple_test.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pyright>=1.1.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
typeCheckingMode = "standard"
